<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redz AI - Global Chat & Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#3b82f6', secondary: '#1e293b' }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out; fill: #94a3b8; }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        mjx-container { overflow-x: auto; max-width: 100%; }
        .glass-sidebar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden text-slate-800 relative">

    <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm mx-4 transform transition-transform scale-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl text-primary shadow-sm">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold text-slate-800">Masuk ke Redz AI</h2>
                <p id="authSubtitle" class="text-sm text-slate-500 mt-1">Masuk dengan akun global kamu.</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button type="button" id="tabLogin" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white text-slate-800 shadow-sm transition-all" onclick="switchAuthMode('login')">Masuk</button>
                <button type="button" id="tabRegister" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 transition-all" onclick="switchAuthMode('register')">Daftar Akun</button>
            </div>

            <form id="authForm" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">USERNAME</label>
                    <input type="text" id="usernameInput" placeholder="Contoh: redynov" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:outline-none transition-all text-sm" required autocomplete="username">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">PASSWORD (Min. 5 Karakter)</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" minlength="5" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/20 focus:border-primary focus:outline-none transition-all text-sm" required autocomplete="current-password">
                </div>
                
                <div id="authErrorMsg" class="text-red-500 text-xs font-medium text-center hidden"></div>

                <button type="submit" id="authBtn" class="w-full bg-primary hover:bg-blue-600 text-white font-medium py-3 rounded-xl transition-colors shadow-sm flex justify-center items-center gap-2 mt-2">
                    <span id="authBtnText">Masuk Sekarang</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/20 z-30 hidden transition-opacity duration-300 opacity-0"></div>

    <aside id="sidebar" class="fixed right-0 top-0 bottom-0 w-72 glass-sidebar z-40 transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-white/50">
            <div>
                <h2 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-primary"></i> Riwayat Chat
                </h2>
                <p id="loggedInUserDisplay" class="text-xs text-slate-500 font-medium mt-0.5 truncate max-w-[160px]"></p>
            </div>
            <button id="closeSidebarBtn" class="text-slate-400 hover:text-red-500 transition-colors w-8 h-8 flex justify-center items-center rounded-full hover:bg-slate-100">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-4 flex gap-2">
            <button id="newChatBtn" class="flex-1 bg-primary/10 text-primary hover:bg-primary hover:text-white py-2.5 rounded-xl transition-all font-medium flex items-center justify-center gap-2 shadow-sm text-sm">
                <i class="fa-solid fa-plus"></i> Chat Baru
            </button>
            <button id="logoutBtn" class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white px-3 py-2.5 rounded-xl transition-all font-medium flex items-center justify-center shadow-sm text-sm" title="Keluar Akun">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
        <div id="conversationList" class="flex-1 overflow-y-auto px-4 pb-4 flex flex-col gap-2">
            <div class="text-center text-sm text-slate-400 mt-10 italic" id="emptyHistoryMsg">Belum ada riwayat chat di cloud.</div>
        </div>
    </aside>

    <header class="bg-white/80 backdrop-blur-md shadow-sm py-3 px-4 md:px-6 flex justify-between items-center z-10 sticky top-0 border-b border-slate-100">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 shadow-inner overflow-hidden border border-slate-300">
                <i class="fa-solid fa-user text-xl mt-2 text-slate-400"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-bold text-slate-800 leading-tight tracking-tight">Redz AI</h1>
                <p class="text-[10px] md:text-xs text-slate-500 font-medium">by Redy N.A</p>
            </div>
        </div>
        <div class="flex gap-1 md:gap-2">
            <button id="openSidebarBtn" class="text-slate-500 hover:text-primary hover:bg-primary/10 p-2 md:p-2.5 rounded-full transition-all" title="Riwayat Percakapan">
                <i class="fa-solid fa-bars-staggered text-lg"></i>
            </button>
        </div>
    </header>

    <main id="chatArea" class="flex-1 overflow-y-auto chat-container p-4 md:p-6 lg:p-8 flex flex-col gap-6 w-full max-w-4xl mx-auto scroll-smooth">
    </main>

    <footer class="bg-white border-t border-slate-200 p-4 z-10 w-full max-w-4xl mx-auto relative pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        
        <div id="errorBanner" class="hidden absolute -top-12 left-0 right-0 mx-4 bg-red-50 border border-red-200 text-red-600 px-4 py-2 rounded-xl text-sm flex items-center justify-between shadow-sm">
            <span id="errorMessage" class="font-medium">Terjadi kesalahan. Silakan coba lagi.</span>
            <button onclick="hideError()" class="text-red-400 hover:text-red-600 p-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="imagePreviewContainer" class="hidden mb-3 bg-slate-50 border border-slate-200 p-2 rounded-xl shadow-sm inline-flex items-start gap-2 relative">
            <img id="imagePreview" src="" alt="Preview" class="h-16 w-16 object-cover rounded-lg">
            <button type="button" id="removeImageBtn" class="absolute -top-2 -right-2 bg-white text-slate-500 hover:text-red-500 border border-slate-200 rounded-full w-6 h-6 flex items-center justify-center shadow-sm transition-colors">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
        </div>

        <input type="file" id="imageInput" accept="image/*" class="hidden">

        <form id="chatForm" class="relative flex items-end gap-2 bg-slate-50 border border-slate-300 rounded-2xl p-2 shadow-inner focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all">
            <button type="button" id="uploadImgBtn" class="p-3 text-slate-400 hover:text-primary transition-colors flex-shrink-0 rounded-xl hover:bg-slate-200/50" title="Unggah Gambar">
                <i class="fa-regular fa-image text-lg"></i>
            </button>
            <textarea 
                id="userInput" 
                rows="1"
                class="w-full bg-transparent border-none focus:ring-0 resize-none py-3 px-2 text-sm md:text-base placeholder-slate-400 max-h-32"
                placeholder="Ketik pesan lu di sini..."
                required
            ></textarea>
            <button type="submit" id="sendBtn" class="bg-primary hover:bg-blue-600 text-white p-3 rounded-xl transition-all flex-shrink-0 shadow-sm flex items-center justify-center w-12 h-12 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
        <div class="text-center mt-2 text-[10px] text-slate-400 font-medium">
            AI dapat melakukan kesalahan. Harap periksa informasi penting.
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = 'redz-ai-global-app';

        // MASUKKAN CONFIG FIREBASE KAMU DI SINI:
        const firebaseConfig = {
        apiKey: "AIzaSyCLFa7lz2OchuGTFZE70ipQ5s0yn5s8z_g",
        authDomain: "redzai.firebaseapp.com",
        projectId: "redzai",
        storageBucket: "redzai.firebasestorage.app",
        messagingSenderId: "979765366916",
        appId: "1:979765366916:web:b534f49c3c149e6da632d1",
        measurementId: "G-4PDHH7CDZL"
        };
        
        let app, db, auth;
        let currentUser = null; // Menyimpan data user login aktif: { username, uid }
        let currentAuthMode = 'login'; // 'login' atau 'register'

        let currentConversationId = null;
        let currentMessages = [];
        let allConversations = [];

        // DOM References
        const authModal = document.getElementById('authModal');
        const authForm = document.getElementById('authForm');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authBtnText = document.getElementById('authBtnText');
        const authErrorMsg = document.getElementById('authErrorMsg');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loggedInUserDisplay = document.getElementById('loggedInUserDisplay');
        const logoutBtn = document.getElementById('logoutBtn');

        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatArea = document.getElementById('chatArea');
        const sendBtn = document.getElementById('sendBtn');
        const errorBanner = document.getElementById('errorBanner');
        const errorMessage = document.getElementById('errorMessage');
        
        const imageInput = document.getElementById('imageInput');
        const uploadImgBtn = document.getElementById('uploadImgBtn');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageBtn = document.getElementById('removeImageBtn');

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const openSidebarBtn = document.getElementById('openSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const conversationList = document.getElementById('conversationList');
        const emptyHistoryMsg = document.getElementById('emptyHistoryMsg');

        let currentImageBase64 = null;
        let currentImageMimeType = null;

        // Inisialisasi Firebase
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Cek apakah sudah tersimpan sesi login di localStorage browser untuk auto-login
            const savedSession = localStorage.getItem('redz_ai_session');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    if (currentUser) {
                        // Sesi valid, sembunyikan modal auth dan muat data cloud
                        authModal.classList.add('hidden');
                        loggedInUserDisplay.textContent = `@${currentUser.username}`;
                        await loadConversationsFromCloud();
                    } else {
                        // Belum ada sesi lokal, sign out auth anonymous dan tampilkan modal
                        authModal.classList.remove('hidden');
                    }
                } else {
                    // Autentikasi anonim default untuk memulai koneksi cloud database
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                }
            });

        } catch (error) {
            console.error("Firebase init error:", error);
            showError("Gagal terhubung ke server cloud penyimpanan.");
        }

        // Switch Auth Mode (Login / Register)
        window.switchAuthMode = function(mode) {
            currentAuthMode = mode;
            authErrorMsg.classList.add('hidden');
            if (mode === 'login') {
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-white text-slate-800 shadow-sm transition-all";
                tabRegister.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 transition-all";
                authTitle.textContent = "Masuk ke Redz AI";
                authSubtitle.textContent = "Masuk dengan akun global kamu.";
                authBtnText.textContent = "Masuk Sekarang";
            } else {
                tabRegister.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-white text-slate-800 shadow-sm transition-all";
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 transition-all";
                authTitle.textContent = "Daftar Akun Baru";
                authSubtitle.textContent = "Buat akun global baru untuk simpan riwayat di cloud.";
                authBtnText.textContent = "Daftar & Masuk";
            }
        };

        // Handle Proses Submit Form Auth (Login & Register)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawUsername = usernameInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!rawUsername || !password) return;
            if (password.length < 5) {
                showAuthError("Password minimal harus 5 karakter!");
                return;
            }

            const authBtn = document.getElementById('authBtn');
            authBtn.disabled = true;
            authBtnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
            authErrorMsg.classList.add('hidden');

            try {
                // Path koleksi global users di Firestore: artifacts/{appId}/public/data/global_users
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'global_users', rawUsername);
                const userSnapshot = await getDoc(userDocRef);

                if (currentAuthMode === 'register') {
                    if (userSnapshot.exists()) {
                        showAuthError("Username ini sudah terdaftar! Gunakan username lain.");
                        resetAuthBtn();
                        return;
                    }
                    // Buat akun baru di database global
                    const newUserData = {
                        username: rawUsername,
                        password: password, // Note: Simpan password sederhana sesuai skema database cloud publik app
                        createdAt: Date.now()
                    };
                    await setDoc(userDocRef, newUserData);
                    
                    currentUser = { username: rawUsername, uid: auth.currentUser?.uid || 'anon' };
                    localStorage.setItem('redz_ai_session', JSON.stringify(currentUser));
                    
                    authModal.classList.add('hidden');
                    loggedInUserDisplay.textContent = `@${currentUser.username}`;
                    await loadConversationsFromCloud();
                    resetAuthBtn();
                } else {
                    // Mode Login
                    if (!userSnapshot.exists()) {
                        showAuthError("Username tidak ditemukan! Silakan daftar terlebih dahulu.");
                        resetAuthBtn();
                        return;
                    }
                    const userData = userSnapshot.data();
                    if (userData.password !== password) {
                        showAuthError("Password salah! Silakan coba lagi.");
                        resetAuthBtn();
                        return;
                    }

                    currentUser = { username: rawUsername, uid: auth.currentUser?.uid || 'anon' };
                    localStorage.setItem('redz_ai_session', JSON.stringify(currentUser));

                    authModal.classList.add('hidden');
                    loggedInUserDisplay.textContent = `@${currentUser.username}`;
                    await loadConversationsFromCloud();
                    resetAuthBtn();
                }
            } catch (err) {
                console.error("Auth error:", err);
                showAuthError("Terjadi kesalahan jaringan/database.");
                resetAuthBtn();
            }
        });

        function showAuthError(msg) {
            authErrorMsg.textContent = msg;
            authErrorMsg.classList.remove('hidden');
        }

        function resetAuthBtn() {
            const authBtn = document.getElementById('authBtn');
            authBtn.disabled = false;
            authBtnText.textContent = currentAuthMode === 'login' ? 'Masuk Sekarang' : 'Daftar & Masuk';
        }

        // Logout Session Handler
        logoutBtn.addEventListener('click', () => {
            if (confirm("Yakin mau keluar akun?")) {
                localStorage.removeItem('redz_ai_session');
                currentUser = null;
                currentConversationId = null;
                currentMessages = [];
                allConversations = [];
                chatArea.innerHTML = '';
                usernameInput.value = '';
                passwordInput.value = '';
                authModal.classList.remove('hidden');
                toggleSidebar(false);
            }
        });

        // Sidebar Controls
        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.remove('translate-x-full');
                sidebarOverlay.classList.remove('hidden');
                setTimeout(() => sidebarOverlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                sidebarOverlay.classList.add('opacity-0');
                setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
            }
        }

        openSidebarBtn.addEventListener('click', () => toggleSidebar(true));
        closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
        sidebarOverlay.addEventListener('click', () => toggleSidebar(false));
        newChatBtn.addEventListener('click', () => {
            startNewChat();
            toggleSidebar(false);
        });

        // Input textarea autosize
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.scrollHeight > 128) {
                this.style.overflowY = 'auto';
                this.style.height = '128px';
            } else {
                this.style.overflowY = 'hidden';
            }
            sendBtn.disabled = this.value.trim() === '' && !currentImageBase64;
        });

        uploadImgBtn.addEventListener('click', () => imageInput.click());
        
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        currentImageBase64 = dataUrl.split(',')[1];
                        currentImageMimeType = 'image/jpeg';
                        
                        imagePreview.src = dataUrl;
                        imagePreviewContainer.classList.remove('hidden');
                        sendBtn.disabled = false;
                    }
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', () => {
            currentImageBase64 = null;
            currentImageMimeType = null;
            imageInput.value = '';
            imagePreviewContainer.classList.add('hidden');
            sendBtn.disabled = userInput.value.trim() === '';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function hideError() { errorBanner.classList.add('hidden'); }
        function showError(msg) {
            errorMessage.textContent = msg;
            errorBanner.classList.remove('hidden');
            setTimeout(hideError, 5000);
        }
        function scrollToBottom() {
            chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
        }

        // Sinkronisasi Riwayat Chat Cloud Global berdasarkan Username
        async function loadConversationsFromCloud() {
            if (!currentUser) return;
            // Path koleksi chat cloud khusus user: artifacts/{appId}/public/data/global_users/{username}/conversations
            const convRef = collection(db, 'artifacts', appId, 'public', 'data', 'global_users', currentUser.username, 'conversations');
            try {
                const snapshot = await getDocs(convRef);
                allConversations = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                })).sort((a, b) => b.updatedAt - a.updatedAt);
                
                renderSidebar();
                
                if (allConversations.length === 0) {
                    startNewChat();
                } else {
                    loadConversation(allConversations[0].id);
                }
            } catch (error) {
                console.error("Error loading cloud history:", error);
            }
        }

        function renderSidebar() {
            conversationList.innerHTML = '';
            if (allConversations.length === 0) {
                emptyHistoryMsg.style.display = 'block';
                return;
            }
            emptyHistoryMsg.style.display = 'none';

            allConversations.forEach(conv => {
                const btn = document.createElement('button');
                const isAktif = conv.id === currentConversationId;
                btn.className = `w-full text-left p-3 rounded-xl transition-colors text-sm truncate flex items-center gap-2 ${isAktif ? 'bg-primary/10 text-primary font-medium' : 'hover:bg-slate-100 text-slate-700'}`;
                btn.innerHTML = `<i class="fa-regular fa-message opacity-70"></i> ${conv.title || 'Chat Baru'}`;
                btn.onclick = () => {
                    loadConversation(conv.id);
                    toggleSidebar(false);
                };
                conversationList.appendChild(btn);
            });
        }

        function startNewChat() {
            currentConversationId = null;
            currentMessages = [];
            chatArea.innerHTML = '';
            
            const welcomeMsg = `Halo @${currentUser.username}! 👋 Gue **Redz AI** nih.\n\nAda yang bisa gue bantu hari ini? Lo bisa nanya apa aja, bahas soal Matematika yang susah, atau nanya seputar gambar. Santuy aja ketik di bawah yak!`;
            
            currentMessages.push({ role: 'model', text: welcomeMsg });
            renderChatArea();
        }

        function loadConversation(id) {
            const conv = allConversations.find(c => c.id === id);
            if (conv) {
                currentConversationId = conv.id;
                currentMessages = conv.messages || [];
                renderChatArea();
                renderSidebar();
            }
        }

        async function saveMessageToCloud(role, text, imageBase64 = null) {
            if (!currentUser) return;
            
            const newMessage = { role, text, image: imageBase64 };
            currentMessages.push(newMessage);

            const convRef = collection(db, 'artifacts', appId, 'public', 'data', 'global_users', currentUser.username, 'conversations');
            const now = Date.now();

            try {
                if (!currentConversationId) {
                    const title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                    const docRef = await addDoc(convRef, {
                        title: title,
                        messages: currentMessages,
                        updatedAt: now
                    });
                    currentConversationId = docRef.id;
                    
                    allConversations.unshift({ id: docRef.id, title, messages: currentMessages, updatedAt: now });
                } else {
                    const docToUpdate = doc(db, 'artifacts', appId, 'public', 'data', 'global_users', currentUser.username, 'conversations', currentConversationId);
                    await updateDoc(docToUpdate, {
                        messages: currentMessages,
                        updatedAt: now
                    });
                    
                    const idx = allConversations.findIndex(c => c.id === currentConversationId);
                    if (idx > -1) {
                        allConversations[idx].messages = currentMessages;
                        allConversations[idx].updatedAt = now;
                        const moved = allConversations.splice(idx, 1)[0];
                        allConversations.unshift(moved);
                    }
                }
                renderSidebar();
            } catch (error) {
                console.error("Error saving message to cloud:", error);
            }
        }

        function formatSimpleMarkdown(text) {
            if (!text) return '';
            let html = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold">$1</strong>');
            html = html.replace(/```([\s\S]*?)```/g, '<pre class="bg-slate-800 text-slate-100 p-3 rounded-xl overflow-x-auto my-2 text-sm font-mono"><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code class="bg-slate-200 px-1.5 py-0.5 rounded text-sm text-primary font-mono">$1</code>');
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        function renderChatArea() {
            chatArea.innerHTML = '';
            currentMessages.forEach(msg => appendMessageElement(msg.role, msg.text, msg.image));
        }

        function appendMessageElement(role, text, imageSrc = null, isLoading = false) {
            const messageDiv = document.createElement('div');
            
            if (role === 'user') {
                messageDiv.className = 'flex gap-3 md:gap-4 w-full flex-row-reverse';
                let imageHtml = imageSrc ? `<img src="${imageSrc}" class="max-w-[200px] rounded-lg mb-2 border border-slate-200 object-cover shadow-sm">` : '';
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary flex-shrink-0 shadow-sm border border-primary/20">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                    <div class="bg-primary text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm max-w-[85%] whitespace-pre-wrap text-sm md:text-base flex flex-col items-end">
                        ${imageHtml}
                        ${formatSimpleMarkdown(text)}
                    </div>
                `;
            } else {
                messageDiv.className = 'flex gap-3 md:gap-4 w-full group';
                
                if (isLoading) {
                    messageDiv.id = 'typingIndicator';
                    messageDiv.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 flex-shrink-0 shadow-sm overflow-hidden border border-slate-300">
                            <i class="fa-solid fa-user mt-2 text-slate-400"></i>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-5 py-4 shadow-sm flex items-center h-[52px]">
                            <svg width="24" height="12" viewBox="0 0 24 12" xmlns="http://www.w3.org/2000/svg">
                                <circle class="typing-dot" cx="4" cy="6" r="3" />
                                <circle class="typing-dot" cx="12" cy="6" r="3" />
                                <circle class="typing-dot" cx="20" cy="6" r="3" />
                            </svg>
                        </div>
                    `;
                } else {
                    let imageHtml = imageSrc ? `<div class="bg-white border border-slate-200 rounded-2xl p-2 shadow-sm mb-2"><img src="${imageSrc}" class="w-full rounded-xl" alt="Image"></div>` : '';
                    
                    messageDiv.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-500 flex-shrink-0 mt-1 shadow-sm overflow-hidden border border-slate-300">
                            <i class="fa-solid fa-user mt-2 text-slate-400"></i>
                        </div>
                        <div class="flex flex-col gap-1 max-w-[85%] min-w-0">
                            ${imageHtml}
                            <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-sm px-4 md:px-5 py-3 md:py-4 shadow-sm text-sm md:text-base overflow-x-auto break-words leading-relaxed text-slate-700">
                                ${formatSimpleMarkdown(text)}
                            </div>
                        </div>
                    `;
                }
            }
            
            chatArea.appendChild(messageDiv);
            scrollToBottom();

            if (!isLoading && role === 'model' && window.MathJax) {
                MathJax.typesetPromise([messageDiv]).catch((err) => console.log('MathJax Error:', err.message));
            }
            
            return messageDiv;
        }

        async function fetchAIResponse(userText, imageBase64, imageMime) {
            const userParts = [{ text: userText }];
            if (imageBase64 && imageMime) {
                userParts.push({ inlineData: { mimeType: imageMime, data: imageBase64 } });
            }

            const apiHistory = currentMessages.map(msg => ({
                role: msg.role,
                parts: [{ text: msg.text }] 
            }));
            
            apiHistory.push({ role: 'user', parts: userParts });

            const payload = {
                contents: apiHistory,
                systemInstruction: {
                    parts: [{ text: `Kamu adalah Redz AI, asisten cerdas buatan Redy N.A. Gaya bahasamu gaul, santai, asik, ala anak muda sekarang (pakai sapaan lo/gue), tapi tetap sopan. Lawan bicaramu bernama @${currentUser.username}. Jika menjawab soal Matematika/Fisika/Sains, WAJIB gunakan format LaTeX dengan dibungkus simbol '$' untuk inline (misal: $x^2$) atau '$$' untuk blok (misal: $$\\frac{a}{b}$$) agar rumus matematika terbaca rapi dan tidak berantakan.` }]
                }
            };

            const apiKey = "AQ.Ab8RN6L1NckCCCGJc22fmttVMBmDxesbZxS_cHhpa6phAxHcaQ"; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (aiText) {
                    const indicator = document.getElementById('typingIndicator');
                    if (indicator) indicator.remove();
                    
                    appendMessageElement('model', aiText);
                    await saveMessageToCloud('model', aiText);
                }
            } catch (error) {
                console.error("API Error:", error);
                const indicator = document.getElementById('typingIndicator');
                if (indicator) indicator.remove();
                showError("Gagal menghubungi AI. Cek koneksi internet lo ya.");
                currentMessages.pop(); 
            }
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!currentUser) {
                authModal.classList.remove('hidden');
                return;
            }
            
            const message = userInput.value.trim();
            const hasImage = currentImageBase64 !== null;
            if (!message && !hasImage) return;

            const msgToDisplay = message || "Tolong analisis gambar ini.";
            
            const imgB64 = currentImageBase64;
            const imgMime = currentImageMimeType;
            const imgDataUrl = hasImage ? imagePreview.src : null;

            userInput.value = '';
            userInput.style.height = 'auto';
            removeImageBtn.click();
            sendBtn.disabled = true;
            hideError();

            appendMessageElement('user', msgToDisplay, imgDataUrl);
            await saveMessageToCloud('user', msgToDisplay, imgDataUrl);

            appendMessageElement('model', '', null, true);

            await fetchAIResponse(msgToDisplay, imgB64, imgMime);
        });

    </script>
</body>
